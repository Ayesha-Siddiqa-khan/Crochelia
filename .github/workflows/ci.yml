name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ayesha-siddiqa-khan/crochelia
  KUBECONFIG: /home/runner/.kube/config

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }} \
            --build-arg NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Write kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          [ -n "$KUBECONFIG_CONTENT" ] || { echo "ERROR: KUBE_CONFIG secret is empty"; exit 1; }
          printf '%s' "$KUBECONFIG_CONTENT" | base64 -d > "$HOME/.kube/config" || {
            echo "ERROR: KUBE_CONFIG is not valid base64. Generate the value with terraform/scripts/generate-kubeconfig-github.sh (the KUBE_CONFIG_DATA base64 blob)."
            exit 1
          }
          chmod 600 "$HOME/.kube/config"

      - name: Verify kubeconfig
        run: |
          echo "=== kubectl version ==="
          kubectl version --client
          echo "=== cluster server ==="
          kubectl config view -o jsonpath='{.clusters[0].cluster.server}'
          echo ""
          echo "=== current context ==="
          kubectl config current-context
          echo "=== reachable? ==="
          kubectl cluster-info
          echo "=== nodes ==="
          kubectl get nodes -o wide
          echo "=== node conditions ==="
          kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}: {.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}'
          echo "=== kube-system pods ==="
          kubectl get pods -n kube-system -o wide

      - name: Create namespace
        run: |
          kubectl create namespace crochelia --dry-run=client -o yaml | kubectl apply -f -

      - name: Validate GHCR access
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image is pullable
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "=== Validating image: $IMAGE_REF ==="
          if docker manifest inspect "$IMAGE_REF" > /dev/null 2>&1; then
            echo "Image manifest accessible from GHCR."
          else
            echo ""
            echo "WARNING: Cannot inspect image manifest at $IMAGE_REF"
            echo "The image may not exist yet or GITHUB_TOKEN lacks packages:read."
            echo ""
            echo "FIX: Go to repo Settings > Actions > General > Workflow permissions"
            echo "     Select 'Read repository contents and packages permissions'"
            echo "     Then re-run this workflow."
            exit 1
          fi

      - name: Create GHCR pull secret
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password="$GHCR_TOKEN" \
            -n crochelia --dry-run=client -o yaml | kubectl apply -f -

      - name: Create app secrets
        run: |
          kubectl create secret generic crochelia-secret \
            --from-literal=SUPABASE_SECRET_KEY="${{ secrets.SUPABASE_SECRET_KEY }}" \
            --from-literal=ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --from-literal=SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --from-literal=SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" \
            -n crochelia --dry-run=client -o yaml | kubectl apply -f -

      - name: Create configmap
        run: |
          kubectl create configmap crochelia-config \
            --from-literal=NODE_ENV="production" \
            --from-literal=NEXT_PUBLIC_SITE_URL="${{ secrets.NEXT_PUBLIC_SITE_URL }}" \
            -n crochelia --dry-run=client -o yaml | kubectl apply -f -

      - name: Clean up stale resources
        run: |
          kubectl delete deployment crochelia -n crochelia --ignore-not-found
          kubectl delete rs -n crochelia --all --ignore-not-found
          kubectl delete pods -n crochelia --all --ignore-not-found

      - name: Deploy
        run: |
          TAG=${{ github.sha }}
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          sed -i "s|__IMAGE__:__TAG__|${IMAGE}:${TAG}|g" k8s/crochelia/deployment.yaml
          kubectl apply -f k8s/crochelia/deployment.yaml
          kubectl apply -f k8s/crochelia/service.yaml
          kubectl apply -f k8s/crochelia/hpa.yaml
          kubectl rollout status deployment/crochelia -n crochelia --timeout=300s
          echo "=== Pods ==="
          kubectl get pods -n crochelia

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== All pods ==="
          kubectl get pods -A -o wide
          echo "=== Node details ==="
          kubectl describe nodes
          echo "=== Crochelia pod describe ==="
          kubectl describe pods -n crochelia
          echo "=== Crochelia pod logs ==="
          for pod in $(kubectl get pods -n crochelia -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs "$pod" -n crochelia --tail=50 2>&1 || true
            echo "--- $pod previous ---"
            kubectl logs "$pod" -n crochelia --tail=50 --previous 2>&1 || true
          done
          echo "=== Events ==="
          kubectl get events -n crochelia --sort-by=.lastTimestamp 2>&1 || true
          echo "=== Kube-system pods ==="
          kubectl get pods -n kube-system -o wide
          echo "=== Kubelet status ==="
          kubectl get nodes -o wide
          echo "=== Node conditions ==="
          kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{range .status.conditions[*]}  {.type}: {.status} - {.message}{"\n"}{end}{end}'
