# Assumes ingress-nginx and cert-manager are already installed in-cluster
# (see ../ingress-nginx/ and ../cert-manager/ — provisioned separately,
# this file only wires the app's own route).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crochelia
  namespace: crochelia
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - crochelia.example.com
      secretName: crochelia-tls
  rules:
    - host: crochelia.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crochelia
                port:
                  number: 80
