apiVersion: v1
kind: Service
metadata:
  name: crochelia
  namespace: crochelia
spec:
  type: NodePort
  # Each node's NodePort serves only its local pod — avoids cross-node pod
  # traffic (Calico VXLAN between the two nodes is currently unreliable).
  externalTrafficPolicy: Local
  selector:
    app: crochelia
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30691
