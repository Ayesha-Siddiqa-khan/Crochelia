apiVersion: apps/v1
kind: Deployment
metadata:
  name: crochelia
  namespace: crochelia
  labels:
    app: crochelia
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crochelia
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: crochelia
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      # Graceful shutdown: give in-flight requests time to finish before
      # the container is killed. PROJECT.md's DevOps requirements.
      terminationGracePeriodSeconds: 30
      containers:
        - name: crochelia
          image: __IMAGE__:__TAG__ # set by CI (ghcr.io/<org>/crochelia:<sha>) — see .github/workflows/ci.yml
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: crochelia-config
            - secretRef:
                name: crochelia-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
